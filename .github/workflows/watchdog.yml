# Watch the hosted showcase from OUTSIDE it, and open an issue while it is unhealthy.
#
# On 2026-10-19 the showcase host's disk filled, Postgres crashed, and every console was down for
# ~4 days before anyone looked. Nothing on the host could have said so: Grafana has no contact point,
# and a check that runs on the host shares its fate. This runs on GitHub's runners instead.
#
# Every 15 minutes .github/watchdog/probe.py checks every host the Caddyfile serves, and every
# critical Grafana rule (read anonymously, so the disk rules in
# showcase/observability/showcase-alerting-rules.yaml reach here before the disk is full).
# .github/watchdog/report.sh then keeps one `watchdog` issue in step with what it found: opened
# (mentioning the repository owner, so GitHub notifies them by email and on the mobile app), commented
# only when the list changes, and closed once everything passes.
#
# Warnings are not outages and are not reported as they fire - several fire routinely on a demo this
# small. But one that fires for weeks says nothing, and nobody opens Grafana to see it, so a warning
# that has stood for WARNING_DAYS days (the repository variable WATCHDOG_WARNING_DAYS, 3 if unset)
# is reported once, on a `watchdog-warning` issue of its own (TODO-3 item 184 in the hippocampus
# repository).
#
# GitHub disables a scheduled workflow in a public repository after 60 days with no commits. A
# disabled watchdog says nothing, so re-enable it under Actions if the repository goes quiet.

name: Watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_DOMAIN: ${{ vars.SHOWCASE_BASE_DOMAIN || 'hippocampus-demo.com' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      WARNING_DAYS: ${{ vars.WATCHDOG_WARNING_DAYS || '3' }}
    steps:
      - uses: actions/checkout@v7

      - name: Probe the showcase
        run: python3 -I .github/watchdog/probe.py | tee problems.txt

      - name: Open, update or close the watchdog issue
        run: |
          .github/watchdog/report.sh watchdog problems.txt "Showcase unhealthy" \
            "the showcase watchdog found a problem"

      # A separate issue, so that a warning which cannot be fixed today never holds the outage issue
      # open, and so that an outage never reads as the warnings having recovered. Exit 3 means
      # Grafana could not be read; the step above has already reported that, so this leaves the
      # warning issue exactly as it was.
      - name: Report warnings that have stood for days
        run: |
          set -euo pipefail

          rc=0
          python3 -I .github/watchdog/probe.py --warnings > warnings.txt || rc=$?
          cat warnings.txt

          if [[ ${rc} -eq 3 ]]; then
            exit 0
          fi

          if [[ ${rc} -ne 0 ]]; then
            exit "${rc}"
          fi

          .github/watchdog/report.sh watchdog-warning warnings.txt "Showcase warning standing" \
            "a warning alert has been firing for ${WARNING_DAYS} days or more"
