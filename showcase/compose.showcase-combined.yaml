# Hosted showcase, BOTH examples under ONE domain, on ONE host. This merges the separate book and
# logs stacks into a single compose project so that a single Caddy owns :80/:443 (two Caddys cannot),
# fronting both consoles plus a SHARED Keycloak and a SHARED Grafana. It is the consolidated
# counterpart to compose.showcase-book.yaml + compose.showcase-logs.yaml — same server
# side, same split-issuer design, but one front proxy and one identity provider instead of two.
#
#   BASE_DOMAIN=hippocampus.example ACME_EMAIL=you@example.com \
#     podman compose -f showcase/compose.showcase-combined.yaml up --build -d
#
# Everything hangs off ONE parent domain via four subdomains (defaults in parentheses):
#   book console:  https://book.${BASE_DOMAIN}/ui       (book.hippocampus.example)
#   logs console:  https://logs.${BASE_DOMAIN}/ui       (logs.hippocampus.example)
#   keycloak:      https://auth.${BASE_DOMAIN}/         (auth.hippocampus.example) — SHARED by both
#   grafana:       https://grafana.${BASE_DOMAIN}/      (grafana.hippocampus.example) — SHARED by both
#   config builder: https://config-builder.${BASE_DOMAIN}/ (config-builder.hippocampus.example)
#   gRPC:          <vm>:50051 (book), <vm>:50052 (logs) — published for optional external tooling
#                  (the in-stack generators reach the services by name, not via these ports)
#
# Point DNS A/AAAA records for those five names (or a single *.${BASE_DOMAIN} wildcard) at the host,
# with 80/443 reachable for the ACME challenge.
#
# THE SPLIT-ISSUER FIX (see Caddyfile.book for the full rationale): Caddy joins the `shared` network
# carrying auth.${BASE_DOMAIN} as an alias, so BOTH hippocampus containers resolve the issuer host to
# Caddy and reach Keycloak at exactly the URL the browser uses. HIPPOCAMPUS_AUTH_ISSUER is therefore
# the same public https URL on both sides.
#
# SHARED KEYCLOAK: one realm (showcase/keycloak/realm-hippocampus.json) already defines the console
# client with BOTH console redirect URIs and one hippocampus-gen client, so a single Keycloak serves
# both examples. A token from either console is valid at either service (shared identity) — fine for a
# demo. The tracked realm's redirect URIs use the placeholder BASE_DOMAIN (hippocampus.example); for a
# real domain install-ubuntu.sh renders a copy with BASE_DOMAIN substituted in and mounts it via
# KEYCLOAK_REALM_FILE (a hand run would otherwise 400 with "Invalid parameter: redirect_uri"). Still
# change the demo secrets (Postgres, Keycloak admin, the gen client secret) for anything real.
#
# The book/logs data stores SHARE one Postgres and one OpenSearch container (unlike the standalone
# stacks, which run a pair of each) but stay logically ISOLATED: the shared Postgres hosts two
# databases (`hippocampus_book` / `hippocampus_logs`, created by postgres/init-showcase-combined.sql
# on first boot) and each service uses its own OpenSearch index (`book-memories` / `logs-memories`).
# The two configs (config.showcase-book.json / config.showcase-logs.json) are still reused VERBATIM
# and shared with the standalone stacks, so the per-tenant DSN database name and index name are
# supplied here as HIPPOCAMPUS_STORAGE_POSTGRES_DSN / HIPPOCAMPUS_OPENSEARCH_INDEX env overrides
# rather than by editing the configs. Separate databases are what keep the single-consolidator
# advisory lock from colliding (see postgres/init-showcase-combined.sql); a shared cluster is fine.
#
# The data generators now run as CONTAINERS in this stack (the published
# ghcr.io/fastbean-au/hippocampus-gen-{book,logs} images), so a single `up -d` brings up a fully
# self-driving showcase - the servers AND the load that feeds them. Each runs as the hippocampus-gen
# client (client-credentials, admin role) against the SHARED issuer
# https://auth.${BASE_DOMAIN}/realms/hippocampus, reaching both the issuer (via the Caddy alias) and
# its target service by name over the `shared` network - no host processes or systemd units. Because
# podman-compose 1.0.6 ignores depends_on health conditions on `up -d`, the install-ubuntu.sh systemd
# unit runs showcase/start-generators.sh as an ExecStartPost: it waits for the front Caddy's
# healthcheck (which only passes once the issuer actually serves THROUGH Caddy) and then starts the
# generators, so they never run before the auth path is open and the book's first cycle never misses
# its token and idles a whole period. See docs/showcase.md.
#
# READ-ONLY FOR VISITORS: the realm ships a single demo/demo login, so anyone who signs in to a
# console can browse but not mutate; the writing is done by the hippocampus-gen service account. The
# gRPC ports are still published for optional external tooling, but nothing needs them anymore.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    # Run an init (tini-style) as PID 1 so orphaned children are reaped. The healthcheck below runs
    # BusyBox `wget` over HTTPS, which forks an `ssl_client` helper; when wget exits, ssl_client is
    # reparented to PID 1. Caddy (a Go binary) never wait()s on it, so without an init those helpers
    # pile up as unreaped zombies - one per check - and eventually exhaust the container's PID slots
    # (the healthcheck then can't fork and reports unhealthy despite Caddy being fine). init reaps them.
    init: true
    ports:
      - "80:80"
      - "443:443"
    environment:
      BASE_DOMAIN: "${BASE_DOMAIN:-hippocampus.example}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@example.com}"
    volumes:
      - ./caddy/Caddyfile.combined:/etc/caddy/Caddyfile:ro
      - combined-caddy-data:/data
      - combined-caddy-config:/config
    networks:
      shared:
        aliases:
          - "book.${BASE_DOMAIN:-hippocampus.example}"
          - "logs.${BASE_DOMAIN:-hippocampus.example}"
          - "auth.${BASE_DOMAIN:-hippocampus.example}"
          - "grafana.${BASE_DOMAIN:-hippocampus.example}"
    # NOTE: hippocampus-site is deliberately NOT a depends_on here. Caddy tolerates a down apex (the
    # apex block just 502s while every subdomain keeps working), so gating caddy on the site buys
    # nothing at start-up - and it makes the site impossible to redeploy on its own: a depends_on is a
    # podman `--requires` edge, so with it in place `podman rm` of the site is refused (caddy, and the
    # generators behind it, "require" it) and compose silently restarts the old container instead of
    # swapping in the rebuilt image. Leaving the site out lets showcase/deploy-site.sh recreate just the
    # site with no full-stack bounce. See docs/showcase.md "Updating a running deployment".
    depends_on:
      - hippocampus-book
      - keycloak
      - otel-lgtm
    # Readiness signal for the data generators: report healthy only once the OIDC issuer actually
    # serves THROUGH Caddy (TLS terminated here, proxied to Keycloak) - i.e. the exact URL the
    # generators fetch for discovery. This proves the front door is open AND Keycloak is answering
    # behind it. The generators used to start the instant Keycloak went healthy - before Caddy was
    # listening - then exit on connection-refused/502 and not get restarted. podman-compose 1.0.6's
    # `up -d` does NOT honour depends_on health conditions, so the generators cannot simply gate on
    # this at up-time; instead the systemd unit's ExecStartPost (showcase/start-generators.sh) waits
    # for this healthcheck to pass and then starts them. The caddy:2 image ships wget + ca-certificates
    # and the `auth.` network alias resolves to Caddy itself, so this is a self-contained loop with no
    # public dependency. Nothing else gates on Caddy's health, so tying it to the issuer path is safe.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "8",
          "-O",
          "/dev/null",
          "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus/.well-known/openid-configuration",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      # Generous: on a first install this also waits for ACME to issue the cert and Keycloak to import
      # the realm, both of which the generators genuinely need before they can get a token.
      start_period: 40s

  # ---- landing page: the static apex site, baked into a self-contained Caddy image (repo-root
  #      Containerfile) and served on the shared network, so the front Caddy proxies the apex domain
  #      to it by service name (the apex block in caddy/Caddyfile.combined -> hippocampus-site:80).
  #      Edit ../index.html / ../assets and re-run `up --build` to redeploy the copy. -----------------
  hippocampus-site:
    build:
      context: ..
      dockerfile: Containerfile
    image: hippocampus-demo-site:latest
    restart: unless-stopped
    networks:
      - shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---- config builder: the configuration and deployment wizard, published at
  #      config-builder.${BASE_DOMAIN}. Unlike every other service here it is NOT a demo of the memory
  #      service - it is a tool: a static single-page app (served by the published
  #      hippocampus-config-wizard image, built from cmd/config-wizard in the hippocampus repo) that
  #      builds a config.json and the matching deployment artefacts entirely in the visitor's browser.
  #      It holds no state, reads no store, and makes no outbound request, so it needs neither the
  #      data network nor auth: it joins `shared` only so the front Caddy can reach it by name. ------
  config-builder:
    image: ghcr.io/fastbean-au/hippocampus-config-wizard:latest
    restart: unless-stopped
    networks:
      - shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---- book example: reloaded + summarised daily, decaying under a compressed clock ----------------
  hippocampus-book:
    image: ghcr.io/fastbean-au/hippocampus:latest
    restart: unless-stopped
    ports:
      - "${BOOK_GRPC_PORT:-50051}:50051"
    volumes:
      - ./config.showcase-book.json:/etc/hippocampus/config.json:ro
    environment:
      HIPPOCAMPUS_AUTH_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_AUTH_UI_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      # Co-tenant overrides: own database in the shared Postgres, own index in the shared OpenSearch.
      HIPPOCAMPUS_STORAGE_POSTGRES_DSN: "postgres://hippocampus:hippocampus@postgres:5432/hippocampus_book?sslmode=disable"
      HIPPOCAMPUS_OPENSEARCH_INDEX: "book-memories"
    networks:
      - data
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started
      # Waits for the model to finish pulling, so no memory is stored before it can be embedded.
      ollama:
        condition: service_healthy

  # ---- agent memory: ONE workload, TWO stores, differing only in whether significance was set -----
  #
  # This pair is the demonstration, not two demonstrations. A single writer sends byte-for-byte
  # identical memories - same ids, bodies, events, links, arriving and recalled at the same moments -
  # to both, and the ONLY difference is that the flat store is told every memory is equally
  # significant. With a constant significance the decay ordering reduces to pure recency, since every
  # method divides significance by a function of age, so the flat store IS an LRU store arrived at by
  # configuration rather than by a different algorithm.
  #
  # The two configs are byte-identical apart from their OpenSearch index name. Everything that
  # differs between the consoles is a consequence of the input, which is the whole point: search both
  # for something old and important and it is present in one and gone from the other.
  #
  # Measured version of the same comparison, with the baselines and the caveats:
  # https://github.com/fastbean-au/hippocampus/blob/main/docs/retention.md
  hippocampus-agent:
    image: ghcr.io/fastbean-au/hippocampus:latest
    restart: unless-stopped
    ports:
      - "${AGENT_GRPC_PORT:-50054}:50051"
    volumes:
      - ./config.showcase-agent.json:/etc/hippocampus/config.json:ro
    environment:
      HIPPOCAMPUS_AUTH_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_AUTH_UI_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_STORAGE_POSTGRES_DSN: "postgres://hippocampus:hippocampus@postgres:5432/hippocampus_agent?sslmode=disable"
      HIPPOCAMPUS_OPENSEARCH_INDEX: "agent-memories"
    networks:
      - data
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started

  hippocampus-agent-flat:
    image: ghcr.io/fastbean-au/hippocampus:latest
    restart: unless-stopped
    ports:
      - "${AGENT_FLAT_GRPC_PORT:-50055}:50051"
    volumes:
      - ./config.showcase-agent-flat.json:/etc/hippocampus/config.json:ro
    environment:
      HIPPOCAMPUS_AUTH_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_AUTH_UI_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_STORAGE_POSTGRES_DSN: "postgres://hippocampus:hippocampus@postgres:5432/hippocampus_agent_flat?sslmode=disable"
      HIPPOCAMPUS_OPENSEARCH_INDEX: "agent-flat-memories"
    networks:
      - data
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ---- observer: an LLM agent whose only memory is this store ---------------------------------------
  #
  # Every other demonstration on this site has its significance chosen by a generator. This one has it
  # chosen by an agent: it reads what is new in the Bluesky store, recalls what it already concluded
  # from its own, writes one observation, and rates how much that observation matters. The rating
  # becomes the significance, so what it judged trivia is gone within a day and what it judged a
  # landmark is still there in a month.
  #
  # It reasons with the LOCAL ollama already on this host, so it costs nothing per cycle and needs no
  # API key. That is also why it is a small model and the prose is plain - the judgement being asked
  # for is five bands of importance, which is within a small model's reach in a way that good writing
  # is not.
  #
  # THE MODEL IS SHARED WITH THE BLUESKY DEMO'S AUTO-SUMMARISER, DELIBERATELY. ollama keeps a model
  # resident for five minutes after use, and both of these fire more often than that, so two
  # different generative models meant two permanently resident copies. On a four-core box that was
  # not affordable: with a 3b here and a 0.5b there, ollama held three models (the third being
  # book's all-minilm embeddings, which is a different KIND of model and cannot be shared - its 384
  # dimensions are baked into the OpenSearch k-NN index), ~12 GB resident, and about 60% of the
  # host's CPU. Generations then ran so slowly that this agent timed out and retried, which made it
  # worse again. One shared generative model plus the embedding model is two, not three.
  #
  # 1.5b rather than 0.5b because 0.5b does not reliably follow the reply format or the
  # "do not repeat what you already noted" instruction; rather than 3b because 3b is what made the
  # host unaffordable. Keep this in step with ollama.model in config.showcase-bluesky.json.
  #
  # THE INTERVAL AND TIMEOUT ARE SET BY THE SHARING, NOT BY THIS AGENT. ollama serialises requests
  # per model, and the bluesky auto-summariser - now on the same model - generates from up to forty
  # memories at a time, seventeen times in twenty minutes. A two-minute interval with a ninety-second
  # timeout put this agent in that queue and it timed out on EVERY cycle: sharing bought a great deal
  # of memory and cost latency, which is a trade worth making and not one worth ignoring. Ten minutes
  # collides far less often, and five minutes of patience is enough to wait out a summarisation.
  hippocampus-observer:
    image: ghcr.io/fastbean-au/hippocampus:latest
    restart: unless-stopped
    ports:
      - "${OBSERVER_GRPC_PORT:-50056}:50051"
    volumes:
      - ./config.showcase-observer.json:/etc/hippocampus/config.json:ro
    environment:
      HIPPOCAMPUS_AUTH_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_AUTH_UI_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_STORAGE_POSTGRES_DSN: "postgres://hippocampus:hippocampus@postgres:5432/hippocampus_observer?sslmode=disable"
      HIPPOCAMPUS_OPENSEARCH_INDEX: "observer-memories"
    networks:
      - data
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started
  hippocampus-bluesky:
    image: ghcr.io/fastbean-au/hippocampus:latest
    restart: unless-stopped
    ports:
      - "${BLUESKY_GRPC_PORT:-50053}:50051"
    volumes:
      - ./config.showcase-bluesky.json:/etc/hippocampus/config.json:ro
    environment:
      HIPPOCAMPUS_AUTH_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_AUTH_UI_ISSUER: "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      # Co-tenant overrides: own database in the shared Postgres, own index in the shared OpenSearch.
      HIPPOCAMPUS_STORAGE_POSTGRES_DSN: "postgres://hippocampus:hippocampus@postgres:5432/hippocampus_bluesky?sslmode=disable"
      HIPPOCAMPUS_OPENSEARCH_INDEX: "bluesky-memories"
    networks:
      - data
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started
      # A SOFTER gate than the book service's: summarisation sits in the sleep cycle, not on the
      # write path, so a model that is still pulling costs a logged, skipped candidate rather than a
      # memory stored without its vector. Waiting anyway keeps the first cycles from filling the log
      # with failures nobody needs to read.
      ollama:
        condition: service_healthy

  # ---- data generators (containerised): the self-driving load. Each authenticates as the
  #      hippocampus-gen client (client-credentials, admin role) to the SHARED issuer and dials its
  #      target service by name over the `shared` network. GEN_SECRET must equal the realm's
  #      hippocampus-gen client secret; install-ubuntu.sh renders the realm from GEN_SECRET so the two
  #      always match. For a hand run, set GEN_SECRET to whatever the imported realm carries. ---------

  # Great Expectations, reloaded + summarised once a day under the compressed decay clock. --reset
  # purges the store at the start of every cycle - and the loop's first cycle runs immediately - so a
  # fresh start clears any existing events and memories before loading. Needs the admin role (Purge +
  # the summarisation Sleep), which the hippocampus-gen service account carries.
  hippocampus-gen-book:
    image: ghcr.io/fastbean-au/hippocampus-gen-book:latest
    restart: unless-stopped
    command:
      - "-s"
      - "hippocampus-book:50051"
      - "--loop"
      - "--period"
      - "24h"
      - "--reset"
      - "--pace-window"
      - "2h"
      - "--live"
      - "--summarize"
      - "--oidc-issuer"
      - "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      - "--oidc-client-id"
      - "hippocampus-gen"
      - "--oidc-client-secret"
      - "${GEN_SECRET:-showcase-gen-secret-change-me}"
    networks:
      - shared
    depends_on:
      hippocampus-book:
        condition: service_started
      keycloak:
        condition: service_healthy
      # Intent: do not start until the issuer actually serves through Caddy, not just until Keycloak
      # is internally healthy. podman-compose 1.0.6 IGNORES these health conditions on `up -d` (kept
      # for correctness / a compose that honours them); the operative gate is the unit's ExecStartPost
      # (showcase/start-generators.sh), which waits for the caddy healthcheck and then starts these.
      caddy:
        condition: service_healthy

  # A steady ~120 lines/min trickle at the current time, reaped by consolidation + capacity eviction
  # so the store stays bounded. Storing memories needs the writer role, which admin includes.
  # ONE writer for BOTH agent stores. Deliberately one rather than two: two writers would drift -
  # different traces, different arrival times - and the comparison depends on the two stores having
  # received exactly the same thing. --flat-address is the second target, and the only thing that
  # differs on the way there is the constant significance.
  #
  # --sim-days-per-wall-minute must match consolidation.unitsOfAgeInDays in BOTH configs; the writer
  # reads the setting back at startup and refuses to run if it disagrees, so a drift between these
  # two numbers fails loudly instead of quietly measuring a decay rate nobody chose.
  hippocampus-gen-agent:
    image: ghcr.io/fastbean-au/hippocampus-gen-agent:latest
    restart: unless-stopped
    command:
      - "--live"
      - "-s"
      - "hippocampus-agent:50051"
      - "--flat-address"
      - "hippocampus-agent-flat:50051"
      - "--memories"
      - "20000"
      - "--days"
      - "60"
      - "--sim-days-per-wall-minute"
      - "5"
      - "--workers"
      - "8"
      - "--oidc-issuer"
      - "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      - "--oidc-client-id"
      - "hippocampus-gen"
      - "--oidc-client-secret"
      - "${GEN_SECRET:-showcase-gen-secret-change-me}"
    networks:
      - shared
    depends_on:
      hippocampus-agent:
        condition: service_started
      hippocampus-agent-flat:
        condition: service_started
      keycloak:
        condition: service_healthy
      caddy:
        condition: service_healthy

  # The agent itself. Reads the Bluesky store, writes to its own, reasons with the local ollama.
  # --once is not set, so it loops on --interval until stopped.
  hippocampus-gen-observer:
    image: ghcr.io/fastbean-au/hippocampus-gen-observer:latest
    restart: unless-stopped
    command:
      - "-s"
      - "hippocampus-observer:50051"
      - "--source-address"
      - "hippocampus-bluesky:50051"
      - "--ollama-url"
      - "http://ollama:11434"
      - "--model"
      - "${OBSERVER_MODEL:-qwen2.5:1.5b}"
      - "--interval"
      - "10m"
      - "--model-timeout"
      - "300s"
      - "--group"
      - "observer"
      - "--oidc-issuer"
      - "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      - "--oidc-client-id"
      - "hippocampus-gen"
      - "--oidc-client-secret"
      - "${GEN_SECRET:-showcase-gen-secret-change-me}"
    networks:
      # BOTH networks: shared reaches the two hippocampus services and the issuer through Caddy,
      # data reaches ollama - which is on data only, like every other backing service. On shared
      # alone the agent starts, reads, and then fails every cycle on "lookup ollama: no such host".
      - data
      - shared
    depends_on:
      hippocampus-observer:
        condition: service_started
      hippocampus-bluesky:
        condition: service_started
      ollama:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      caddy:
        condition: service_healthy
  hippocampus-bluesky-bridge:
    image: ghcr.io/fastbean-au/hippocampus-bluesky-bridge:latest
    restart: unless-stopped
    command:
      - "--address"
      - "hippocampus-bluesky:50051"
      - "--feed"
      - "${BLUESKY_FEED:-at://did:plc:kkf4naxqmweop7dv4l2iqqf5/app.bsky.feed.generator/news-2-0}"
      - "--feed-backfill"
      - "--feed-seed-recalls"
      - "--feed-poll-seconds"
      - "60"
      - "--topic-links"
      # The feed's post opens an event and the public's replies to it become memories in that event,
      # which is the conversation this instance exists to show. --capture-replies needs the UNFILTERED
      # subscription (so: never a --dids here), because a reply is a record in the replier's own
      # repository rather than in that of the post it answers.
      - "--events"
      - "thread"
      - "--capture-replies"
      # A reply is worth keeping without being worth as much as the headline it answers. A method-1
      # lifetime is about significance/deletionThreshold age units, so at threshold 5 a capture lives
      # ~0.6 units against a headline's 2 and a thread thins back to its head rather than going whole.
      - "--capture-significance"
      - "3"
      - "--group"
      - "news"
      - "--group-from-subject=false"
      - "--significance"
      - "10"
      - "--metadata"
      - "source=bluesky"
      - "--metadata-header"
      - "handle"
      - "--metadata-header"
      - "lang"
      - "--recall"
      - "--honour-deletes"
      - "--metrics"
      - "--otlp-endpoint"
      - "otel-lgtm:4317"
      - "--metrics-group"
      - "bluesky"
      - "--oidc-issuer"
      - "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      # Its OWN client, not the generators' hippocampus-gen, and writer rather than admin. The
      # topology view draws an inbound component under the client_id it authenticated with and
      # merges it with a declared component of the same name, so sharing hippocampus-gen would have
      # put the bridge, the book generator and the logs generator behind one indistinguishable node
      # - and left the declared entry in config.showcase-bluesky.json unable to merge with any of
      # them. The secret is deliberately still GEN_SECRET; see the realm template for why.
      - "--oidc-client-id"
      - "hippocampus-bluesky-bridge"
      - "--oidc-client-secret"
      - "${GEN_SECRET:-showcase-gen-secret-change-me}"
    networks:
      - shared
    depends_on:
      hippocampus-bluesky:
        condition: service_started
      keycloak:
        condition: service_healthy
      # Intent: do not start until the issuer actually serves through Caddy. podman-compose 1.0.6
      # IGNORES these health conditions on `up -d`; the operative gate is the unit's ExecStartPost
      # (showcase/start-generators.sh), which waits for the caddy healthcheck and then starts these.
      caddy:
        condition: service_healthy

  # A SECOND feed on the same service and the same store: WorldNews
  # (at://did:plc:3sn6bogankaicebzdb7liro3/app.bsky.feed.generator/aaajaq4ut77am) - world coverage from
  # Reuters, AP, the Guardian, the BBC, Al Jazeera and about fifteen others, maintained by
  # @allyann.bsky.social. `--feed` takes a single URI, one feed per process, so a second feed is a
  # second container rather than a second flag.
  #
  # It is deliberately NOT a twin of the bridge above: everything that reads the FIREHOSE is left to
  # that one, because both see the same public stream and would act on it twice.
  #
  #   --recall=false          Reinforcement is blind by id - a like names its target's at:// URI and
  #                           the service reinforces whatever it holds - so the bridge above already
  #                           reinforces THESE posts too, the store being shared. Two recallers would
  #                           count every like twice and inflate every recall count against the
  #                           backfill's one-shot seeds.
  #   --honour-deletes=false  A delete is blind by id in the same way, so it is likewise already
  #                           honoured for these posts by the bridge above.
  #   --dids                  The Jetstream subscription is opened unconditionally, so it is narrowed
  #                           to the feed owner's (near-silent) repository rather than left consuming
  #                           the whole public firehose to produce frames nothing here acts on. This
  #                           logs the "--feed with --dids receives no engagement at all" warning at
  #                           startup; here that is the intent rather than the mistake it warns about.
  #
  # The cost of that split, stated plainly: this feed is only as reinforced as the bridge above is
  # alive. Nothing here replays engagement, so while that container is down these posts decay
  # unopposed. And no --events/--capture-replies either - reply capture matches against the capturing
  # process's OWN index of stored posts, so threads (and with them the auto-summarisation demo) stay a
  # Trending News feature. These are headlines that live or die on engagement alone.
  hippocampus-bluesky-bridge-worldnews:
    image: ghcr.io/fastbean-au/hippocampus-bluesky-bridge:latest
    restart: unless-stopped
    command:
      - "--address"
      - "hippocampus-bluesky:50051"
      - "--feed"
      - "${BLUESKY_FEED_WORLDNEWS:-at://did:plc:3sn6bogankaicebzdb7liro3/app.bsky.feed.generator/aaajaq4ut77am}"
      - "--feed-backfill"
      - "--feed-seed-recalls"
      - "--feed-poll-seconds"
      - "60"
      - "--topic-links"
      # The firehose belongs to the other bridge; see above.
      - "--dids"
      - "did:plc:3sn6bogankaicebzdb7liro3"
      - "--recall=false"
      - "--honour-deletes=false"
      # The same group as the other feed, deliberately. The two overlap heavily - both aggregate the
      # same wire services - and a duplicate write is an idempotent AlreadyExists, so whichever bridge
      # saw a shared story first owns it. Splitting the groups would file the same story differently
      # from one hour to the next. `feed=worldnews` records the source where it can be recorded: on
      # the posts only this feed carried. Its absence means the other feed reached the story first.
      - "--group"
      - "news"
      - "--group-from-subject=false"
      - "--significance"
      - "10"
      - "--metadata"
      - "source=bluesky"
      - "--metadata"
      - "feed=worldnews"
      - "--metadata-header"
      - "handle"
      - "--metadata-header"
      - "lang"
      - "--metrics"
      - "--otlp-endpoint"
      - "otel-lgtm:4317"
      # Its own metrics group, so the two bridges' throughput is separable in Grafana even though
      # their memories are not.
      - "--metrics-group"
      - "bluesky-worldnews"
      - "--oidc-issuer"
      - "https://auth.${BASE_DOMAIN:-hippocampus.example}/realms/hippocampus"
      # Its own client, for the reason the bridge above has one: the topology view draws an inbound
      # component under the client_id it authenticated with, so a shared client would have merged the
      # two bridges into a single indistinguishable node. Secret is GEN_SECRET again; see the realm.
      - "--oidc-client-id"
      - "hippocampus-bluesky-bridge-worldnews"
      - "--oidc-client-secret"
      - "${GEN_SECRET:-showcase-gen-secret-change-me}"
    networks:
      - shared
    depends_on:
      hippocampus-bluesky:
        condition: service_started
      keycloak:
        condition: service_healthy
      caddy:
        condition: service_healthy

  # ---- shared data stores (one Postgres with a database per tenant, one OpenSearch with an index
  #      per tenant); the book/logs services reach these by service name over the `data` network ----
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hippocampus
      POSTGRES_PASSWORD: hippocampus
      POSTGRES_DB: hippocampus
    volumes:
      - combined-postgres-data:/var/lib/postgresql/data
      # Creates hippocampus_book / hippocampus_logs on first boot (empty-volume init only).
      - ./postgres/init-showcase-combined.sql:/docker-entrypoint-initdb.d/init-showcase-combined.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hippocampus -d hippocampus"]
      interval: 5s
      timeout: 3s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.1.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - combined-opensearch-data:/usr/share/opensearch/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 24

  # ---- embedding model for semantic search (book only) --------------------------------------------
  # Hippocampus turns each memory body into a vector through this and stores it in the OpenSearch
  # k-NN index, so the book console's search tab can find a passage by meaning as well as by its
  # words. Wired to the BOOK service only, for two reasons that happen to agree: semantic search is
  # most worth demonstrating on prose, where paraphrase is the whole point, while log lines are terse
  # and structured and keyword search is genuinely the better tool for them - and embedding runs on
  # the write path, so putting it in front of the logs generator's continuous trickle would spend
  # this VM's shared CPU all day for the less interesting demo. The book generator writes in a burst
  # once every 24h and is then quiet, which suits it far better.
  #
  # all-minilm rather than the more usual nomic-embed-text: ~45 MB against ~275 MB and 384 dimensions
  # against 768, which matters on a box already running Postgres, OpenSearch, Keycloak, Grafana, two
  # Hippocampus services and two generators. Prefer nomic-embed-text for a real deployment.
  #
  # It also holds a small GENERATION model for the bluesky service's auto-summarisation. That one is
  # off the write path - it runs inside the sleep cycle, best-effort - so it is sized purely for how
  # much of this box's CPU one summary may cost: qwen2.5:0.5b (~400 MB) rather than the config
  # default llama3.2 (~2 GB). Prefer something larger in a real deployment; override with
  # SUMMARY_MODEL, which needs no reindex (unlike EMBEDDING_MODEL, whose width is fixed at k-NN
  # index creation).
  #
  # The image ships no model, so the entrypoint starts the server, pulls both models, then hands the
  # process back. The healthcheck gates on the MODELS being present rather than the port being open,
  # because a server that is up but still pulling would let hippocampus start and quietly store its
  # first memories without vectors.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull ${EMBEDDING_MODEL:-all-minilm}
        ollama pull ${SUMMARY_MODEL:-qwen2.5:0.5b}
        wait $$server
    volumes:
      - combined-ollama-data:/root/.ollama
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list | grep -q ${EMBEDDING_MODEL:-all-minilm} && ollama list | grep -q ${SUMMARY_MODEL:-qwen2.5:0.5b}",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ---- shared identity provider (one realm, both consoles) ----------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # Full external URL so the token issuer is the public https address; KC_PROXY_HEADERS makes
      # Keycloak trust Caddy's X-Forwarded-* so it knows the request arrived over TLS.
      KC_HOSTNAME: "https://auth.${BASE_DOMAIN:-hippocampus.example}"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      # Expose the /health/* endpoints on the management port (9000) so the generators can gate on a
      # ready IdP rather than racing the realm import and missing their first token.
      KC_HEALTH_ENABLED: "true"
    volumes:
      # KEYCLOAK_REALM_FILE lets the imported realm be swapped for a domain-rendered copy. Default
      # runs use the tracked template (placeholder redirect URIs). install-ubuntu.sh renders
      # realm-hippocampus.generated.json (BASE_DOMAIN substituted into the console redirect URIs) and
      # points this at it, so a real-domain install gets matching redirect URIs. The realm imports on
      # an EMPTY combined-keycloak-data volume only, so install-ubuntu.sh resets that volume when the
      # domain changes.
      - ${KEYCLOAK_REALM_FILE:-./keycloak/realm-hippocampus.json}:/opt/keycloak/data/import/realm.json:ro
      - combined-keycloak-data:/opt/keycloak/data
    networks:
      - shared
    # The image ships no curl/wget, so the probe speaks raw HTTP to the management port over bash's
    # /dev/tcp and looks for an "UP" status. /bin/sh is bash on the UBI base, so /dev/tcp works.
    healthcheck:
      test: >-
        exec 3<>/dev/tcp/localhost/9000 &&
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---- shared telemetry (both services export here; tell them apart by service.name) --------------
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.${BASE_DOMAIN:-hippocampus.example}/"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json
    volumes:
      # GRAFANA_DASHBOARD_FILE swaps in a domain-rendered dashboard, exactly as KEYCLOAK_REALM_FILE
      # does for the realm. This dashboard is Grafana's home dashboard (above), so it is where a
      # visitor following the landing page's Grafana link arrives - and it is the only place a way
      # back to that landing page can live, since Grafana is a whole app with its own nav. The way
      # back is a dashboard link, which needs a real domain to point at: the tracked file therefore
      # ships "links": [] and install-ubuntu.sh renders hippocampus-dashboard.generated.json with the
      # link filled in for BASE_DOMAIN, pointing this at it. A hand run without that render (or the
      # standalone book/logs stacks, which have no landing page at all) simply has no link, rather
      # than a dead one.
      - ${GRAFANA_DASHBOARD_FILE:-./observability/hippocampus-dashboard.json}:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json:ro
      - ./observability/dashboards-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
    networks:
      - shared

networks:
  # Shared data plane: both hippocampus services plus the shared Postgres and OpenSearch.
  data:
  # Front-facing network shared by Caddy, both hippocampus services, the landing page, Keycloak and
  # Grafana. Named explicitly so the name stays stable regardless of the compose project name.
  shared:
    name: hippocampus-shared

volumes:
  combined-postgres-data:
  combined-opensearch-data:
  combined-ollama-data:
  combined-keycloak-data:
  combined-caddy-data:
  combined-caddy-config:
